[project]
name = "powercode-py"
version = "0.1.0"
description = "从零手搓 AI Agent（Python 版）—— 一份让读者无脑跟做的教学项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
graph = [
    "langgraph>=1.0",
]

[project.scripts]
powercode = "powercode_py.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["powercode_py"]
